  <circle cx="64" cy="18" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="64" cy="30" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="64" cy="24" r="2" fill="#fef08a"/>


  <path d="M 52 46 C 47 41 40 38 31 38 C 18 38 9 48 9 64 C 9 80 18 90 31 90 C 40 90 47 87 52 82 L 45 74 C 42 78 37 80 31 80 C 23 80 18 73 18 64 C 18 55 23 48 31 48 C 37 48 42 50 45 54 Z"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cclGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="semiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arka Plan Kartı -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="3.5"/>
  <rect x="10" y="10" width="108" height="108" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Üst Çiçek Motifi -->
  <g transform="translate(64, 28)">
    <circle cx="0" cy="-5.5" r="3.5" fill="#f472b6" opacity="0.9"/>
    <circle cx="5.2" cy="-1.8" r="3.5" fill="#ec4899" opacity="0.9"/>
    <circle cx="3.2" cy="4.5" r="3.5" fill="#d946ef" opacity="0.9"/>
    <circle cx="-3.2" cy="4.5" r="3.5" fill="#d946ef" opacity="0.9"/>
    <circle cx="-5.2" cy="-1.8" r="3.5" fill="#ec4899" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.5" fill="#fef08a"/>
  </g>

  <!-- ccl Metni -->
  <text x="24" y="84" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'FreeSans', sans-serif" font-weight="900" font-size="42" letter-spacing="-1.5" fill="url(#cclGrad)">ccl</text>

  <!-- Zorunlu Semicolon ';' -->
  <g transform="translate(89, 57)" filter="url(#glow)">
    <circle cx="3" cy="10" r="3.5" fill="url(#semiGrad)"/>
    <path d="M 3 17 C 5 17 6 18.2 5.5 20.5 C 4.5 24.5 1 28 -1.5 29 L -2.5 27 C 0 26 2 23.5 2.5 20.5 C 1.5 20.5 0.5 19.5 1.5 18 C 2 17.2 2.5 17 3 17 Z" fill="url(#semiGrad)"/>
  </g>
</svg>
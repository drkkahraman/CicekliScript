  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="4"/>
  <rect x="11" y="11" width="106" height="106" rx="23" ry="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

